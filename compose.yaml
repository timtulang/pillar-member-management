services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pillar
      POSTGRES_USER: pillar_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pillar-postgres:/var/lib/postgresql/data
      - ./database/neon-setup.sql:/docker-entrypoint-initdb.d/001-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillar_local -d pillar"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pillar-postgres:
